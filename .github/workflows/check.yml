name: Check the generated overlay

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Every copied file at its recorded sha256, the bundle equal to the
      # annotations, and a clean Literature Links scan: standard library only.
      - run: python3 pdf-overlay/tools/check_generated.py
